include:
  - template: Terraform/Base.latest.gitlab-ci.yml

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra 
  TF_STATE_NAME: default
  KUBE_CONTEXT: ""

stages:
  - fmt
  - validate
  - build
  - tf-deploy
  #- k8s-deploy

# --- Terraform Stages ---

fmt:
  extends: .terraform:fmt

validate:
  extends: .terraform:validate

build:
  extends: .terraform:build

tf-deploy:
  extends: .terraform:deploy
  environment:
    name: production
  when: manual

