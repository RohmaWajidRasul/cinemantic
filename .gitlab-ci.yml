default:
  tags:
    - docker

image:
  name: hashicorp/terraform:1.7.0
  entrypoint: [""]

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra
  TF_VAR_gitlab_api_url: ${CI_API_V4_URL}

stages:
  -test
  - tf-validate
  - tf-build
  # - k8s-deploy

before_script:
  - cd ${TF_ROOT}
  # These 2 variables are the "Magic Key" - they fix the auth error automatically
  - terraform init

python-tests:
  stage: test
  image: python:3.11
  before_script:
    - pip install pandas
  script:
    - cd model
    - python -m unittest discover -s . -p "test_*.py"

tf-validate:
  stage: tf-validate
  script:
    - terraform validate

tf-build:
  stage: tf-build
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan

