default:
  tags:
    - docker

image:
  name: hashicorp/terraform:1.7.0
  entrypoint: [""]

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra
  TF_VAR_gitlab_api_url: ${CI_API_V4_URL}
  KUBE_CONTEXT: ""

stages:
  - validate
  - build
  - tf-deploy
  # - k8s-deploy

before_script:
  - cd ${TF_ROOT}
  # These 2 variables are the "Magic Key" - they fix the auth error automatically
  - export TF_HTTP_USERNAME="gitlab-ci-token"
  - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
  # This tells Terraform exactly which state file to use
  - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/default"
  - terraform init

validate:
  stage: validate
  script:
    - terraform validate

build:
  stage: build
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan

tf-deploy:
  stage: tf-deploy
  script:
    - terraform apply -auto-approve tfplan
    - terraform output -json > tf_outputs.json
  artifacts:
    paths:
      - ${TF_ROOT}/tf_outputs.json
  when: manual
  only:
    - main
    - 9-add-cloud-deployment-configuration

