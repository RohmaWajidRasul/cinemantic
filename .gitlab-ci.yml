default:
  tags:
    - docker

image:
  name: hashicorp/terraform:1.7.0
  entrypoint: [""]

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra
  TF_VAR_gitlab_api_url: ${CI_API_V4_URL}
  KUBE_CONTEXT: ""

stages:
  - validate
  - build
  - tf-deploy
  # - k8s-deploy

before_script:
  - cd ${TF_ROOT}
  - terraform init -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/default" -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/default/lock" -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/default/lock" -backend-config="username=gitlab-ci-token" -backend-config="password=${CI_JOB_TOKEN}" -backend-config="lock_method=POST" -backend-config="unlock_method=DELETE" -backend-config="retry_wait_min=5"

validate:
  stage: validate
  script:
    - terraform validate

build:
  stage: build
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan

tf-deploy:
  stage: tf-deploy
  script:
    - terraform apply -lock=false -auto-approve tfplan
    - terraform output -json > tf_outputs.json
  artifacts:
    paths:
      - ${TF_ROOT}/tf_outputs.json
  when: manual
  #only:
  #  - main

