{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">
        <h1>Cinemantic</h1>
        <div class="image-container grid">
            <div class="flex">
                <a href="{% url 'register-page' %}">
                    <img id="img1" src="{% static 'popcorn.png' %}" alt="Pop corn bucket illustration">
                </a>
                <h2>Register</h2>
            </div>
            <div class="flex">
                <a href="{% url 'login-page' %}">
                    <img id="img2" src="{% static 'drink.png' %}" alt="Drink illustration">
                </a>
                <h2>Login</h2>
            </div>
        </div>
        
    </div>
    <div class="film-border bottom"></div>
</body>

</html>

<style>
    .wrapper {
        background: #520608 url("{% static 'homepage.jpg' %}") no-repeat center / cover;
        background-blend-mode: luminosity;
        flex-direction: column;
    }

    .flex {
        justify-content: flex-start;
        flex-direction: column;
    }

    h1 {
        font-size: 3.5em;
        font-family: 'Monoton';
        letter-spacing: 5px;
        animation: flicker 3s infinite alternate;
    }

    @keyframes flicker {

        0%,
        20%,
        30%,
        50%,
        60%,
        100% {
            text-shadow:
                0 0 10px rgba(255, 255, 0, 0.4),
                0 0 20px rgba(255, 255, 0, 0.4),
                0 0 40px #ff6600b3,
                0 0 70px #ff6600b3,
                0 0 80px #ff6600b3,
                0 0 100px #ff6600b3,
                0 0 150px #ff6600b3;
        }

        25%,
        40%,
        55% {
            text-shadow:
                0 0 5px rgba(255, 255, 0, 0.4),
                0 0 10px rgba(255, 255, 0, 0.4),
                0 0 15px rgba(255, 255, 0, 0.4),
                0 0 20px #ff6600b3,
                0 0 35px #ff6600b3,
                0 0 40px #ff6600b3,
                0 0 50px #ff6600b3,
                0 0 75px #ff6600b3;
        }
    }

    h2 {
        margin: 0;
        color: white;
    }

    img {
        height: 250px;
        transition: transform 0.2s;
        justify-self: center;
    }

    #img1:hover {
        transform: rotate(-15deg);
    }

    #img2:hover {
        transform: rotate(15deg);
    }
</style>
