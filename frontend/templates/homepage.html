{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">
        <h1>Cinemantic</h1>
        <div class="image-container grid">
            <div class="flex">
                <a href="{% url 'register-page' %}">
                    <img src="{% static 'img/popcorn.png' %}" alt="Pop corn bucket illustration">
                </a>
                <h2 class="neon">Register</h2>
            </div>
            <div class="flex">
                <a href="{% url 'login-page' %}">
                    <img src="{% static 'img/drink.png' %}" alt="Drink illustration">
                </a>
                <h2 class="neon">Login</h2>
            </div>
            <div class="flex">
                <a href="{% url 'search-page' %}">
                    <img id="img3" src="{% static 'img/camera.png' %}" alt="Camera illustration">
                </a>
                <h2 class="neon">Search</h2>
            </div>
        </div>

    </div>
    <div class="film-border bottom"></div>
</body>

</html>

<style>
    .wrapper {
        background: #520608 url("{% static 'img/homepage.jpg' %}") no-repeat center / cover;
        background-blend-mode: luminosity;
    }

    .grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .flex {
        justify-content: flex-start;
        flex-direction: column;
    }

    h1 {
        font-size: 3.5em;
        font-family: 'Monoton';
        letter-spacing: 5px;
        animation: flicker 3s infinite alternate;
    }

    img {
        height: 250px;
        transition: transform 0.2s;
        justify-self: center;
    }

    img:hover {
        transform: rotate(15deg);
    }
</style>
