{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <div class="header">
        <h1>Cinemantic</h1>
    </div>
    <div class="white-container">
        <form class="form" id="login-form" onsubmit="handleLogin(event)">
            <label for="username">Username</label>
            <input type="username" name="username" id="username" placeholder="Username" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Password" required>

            <button type="submit" class="black-button">Login</button>
        </form>
    </div>
    <div class="film-border bottom"></div>
</body>

</html>

<script>
    // Todo: change to Django forms logic
    const API_ENDPOINT = 'http://127.0.0.1:8000/api/v1/users/token/';

    async function handleLogin(event) {
        event.preventDefault();

        const form = document.getElementById('login-form');
        const loginData = {
            username: form.username.value,
            password: form.password.value,
        };
        const targetPage = "{% url 'search-page' %}"

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

            const responseData = await response.json();
            localStorage.setItem('access_token', responseData.access);
            localStorage.setItem('refresh_token', responseData.refresh);
            localStorage.setItem('user', JSON.stringify(responseData.user));

            form.reset();

            const user = JSON.parse(localStorage.getItem("user"));
            console.log('Login successful:', user.is_superuser);

            if (user.is_superuser) {
                window.location.href = "{% url 'admin-page' %}";
            } else {
                window.location.href = "{% url 'search-page' %}";
            }


        } catch (error) {
            console.log("Error:", error.message);

        }
    }


</script>
