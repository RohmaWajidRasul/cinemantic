{% load static %}
{% include "menu.html" with show_home=True show_profile=False show_search=True show_history=True show_logout=True %}
<!DOCTYPE html>
<html>

<head>
    <!--Implemented by Júlia -->
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>

<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">
        <div class="clapperboard">

            <form method="post" class="profile-edit">
                {% csrf_token %}

                <div class="slate-content grid">

                    <div class="form border-right">
                        <label for="current-username">Username</label>
                        <input type="text" name="current-username" id="current-username"
                            value="{{ profile.user.username }}">
                        <div class="chalk-divider"></div>

                        <label for="bio">Bio</label>
                        <input type="text" name="bio" id="bio" value="{{ profile.bio|default:" —" }}">
                    </div>

                    <div class="form">
                        <label for="new-password">New password</label>
                        <input type="password" name="new-password" id="new-password" placeholder="New password">
                        <div class="chalk-divider"></div>

                        <label for="repeate-password">Repeat password</label>
                        <input type="password" name="repeat-password" id="repeat-password"
                            placeholder="Repeat password">
                    </div>

                </div>

                <div class="chalk-divider"></div>
                <div class="button-container grid">
                    <div class="border-right" id="c1"></div>
                    <div class="flex" id="c2">
                        <button onclick="changeInfo()">Change profile</button>
                    </div>
                    <div class="column border-left" id="c3"></div>
                </div>

            </form>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

        </div>
    </div>
    <div class="film-border bottom"></div>
</body>

</html>


<style scoped>
    .clapperboard {
        width: 70%;
        background-color: #1a1a1a;
        border-radius: 10px;
        overflow: visible;
        position: relative;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .clapperboard::before {
        content: '';
        display: block;
        height: 50px;
        width: 100%;
        border-radius: inherit;
        border-bottom: 4px solid #000;
        background: repeating-linear-gradient(45deg,
                #1a1a1a,
                #1a1a1a 20px,
                #f0f0f0 20px,
                #f0f0f0 40px);
        transform-origin: bottom left;
        transition: transform 0.3s ease-in-out;
    }

    .clapperboard:hover::before {
        transform: rotate(-5deg);
    }

    .slate-content,
    .button-container {
        align-items: center;
        width: 100%;
    }

    .form {
        flex-direction: column;
        text-align: left;
        padding: 10px 30px;
        margin: 0;
        letter-spacing: 4px;
    }

    .form label {
        color: white;
        font-weight: normal;
        margin-top: 20px;
    }

    .chalk-divider {
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg,
                rgba(255, 255, 255, 0.8) 20%,
                rgba(240, 240, 240, 0.9) 50%);
        opacity: 0.7;
    }

    .button-container {
        grid-template-columns: repeat(3, 1fr);
    }

    button:hover {
        background-color: rgba(193, 190, 190, 0.5);
    }

    .border-right {
        border-right: 2px solid rgba(240, 240, 240, 0.5);
    }

    .border-left {
        border-left: 2px solid rgba(240, 240, 240, 0.5);
    }

    #c1,
    #c3 {
        height: 100%;
    }

    #c2 {
        margin: 1em 0;
    }
</style>
