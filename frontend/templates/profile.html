{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <main>

        <div class="recommendation">
            <a href="{% url 'recommendation-page' %}">
                <button id="rec-button">
                    <img src="{% static 'chat.png' %}" alt="User Profile">
                </button>
            </a>
        </div>
        <div class="history">
            <a href="{% url 'history-page' %}">
                <button id="history-button">
                    <img src="{% static 'movie.png' %}" alt="User Profile">
                </button>
            </a>
        </div>

        <div class="main-container">
            <div class="form">
                <label for="current-username">Username</label>
                <input type="text" name="current-username" id="current-username" placeholder="Loading username..." disabled>

                <label for="bio">Bio</label>
                <input type="text" name="bio" id="bio" placeholder="Bio" required>

                <div class="button-container">
                    <button onclick="changeUser()" class="blue-button">Change bio</button>
                </div>

            </div>
            <form class="form">
                <label for="new-password">New password</label>
                <input type="password" name="new-password" id="new-password" placeholder="New password" required>

                <label for="repeate-password">Repeat password</label>
                <input type="password" name="repeat-password" id="repeat-password" placeholder="Repeat password" required>
                
                <div class="button-container">
                    <button class="blue-button">Change password</button>
                </div>
            </form>
        </div>

    </main>
    <div class="film-border bottom"></div>
</body>

</html>

<script>
    // Todo: move logic to views 
    const API_ENDPOINT = 'http://127.0.0.1:8000/api/v1/users/me/';

    // Event listener to fetch user data
    document.addEventListener('DOMContentLoaded', () => {
        loadUserProfile();
    });

    // Function to fetch user data
    async function loadUserProfile() {

        const token = localStorage.getItem('access_token');
        const loginPageUrl = "{% url 'login-page' %}";

        const usernameInput = document.getElementById('current-username');
        const bioInput = document.getElementById('bio');

        // Check authentication (tokens)
        if (!token) {
            console.log('Error: Authentication token not found. Redirecting to login.');
            if (usernameInput) {
                usernameInput.value = 'Please log in to view your profile.';
            }
            window.location.href = loginPageUrl;
            return;
        }

        // Fetch user data
        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'GET',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

            const responseData = await response.json();
            console.log('Profile data successfully retrieved:', responseData);

            // Update the username
            if (usernameInput) {

                const username = responseData.profile?.user?.username;
                usernameInput.value = username || 'Username not found.';

            } else {
                console.log(`Error: Username input element not found.`);
            }

            // Update Bio
            if (bioInput) {

                const bio = responseData.profile?.bio;
                bioInput.value = bio || 'Bio not found';

            } else {
                console.log(`Error: Bio input element not found.`);
            }

        } catch (error) {
            console.error('Error:', error.message);
        }
    }

    // Todo: move logic to views 
    async function changeUser() {

        const bioInput = document.getElementById('bio');
        const token = localStorage.getItem('access_token');
        const userData = {
            bio: bioInput.value,
        }

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'PATCH',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                },
                body: JSON.stringify(userData),
            })

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

            const responseData = await response.json();

            bioInput.value = '';
            console.log(responseData);
            loadUserProfile();

        } catch (error) {
            console.log("Error:", error.message);
        }

    }
</script>

<style scoped>
    .main-container {
        display: flex;
        padding: 5px 0px;
        width: 60%;
    }

    .recommendation {
        top: 0px;
    }

    .history {
        top: 60px;
    }

    .form {
        flex: 5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: left;
        margin: 30px auto;
        max-width: 300px;
    }

    .form label {
        color: white;
    }

    .form input {
        background-color: #000;
        color: #f0f0f0;
        border: 2px solid #333;
        box-shadow: inset 0 1px 5px rgba(0, 0, 0, 0.9);
    }

    .form input:focus {
        outline: none;
        border-color: #7e8bcb;
        box-shadow:
            inset 0 1px 5px rgba(0, 0, 0, 0.9),
            0 0 8px #7e8bcb;
    }

    .button-container {
        display: grid;
        justify-items: center;
    }
</style>
