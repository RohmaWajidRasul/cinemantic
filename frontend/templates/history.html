{% load static %}
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>

<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">

        <h1>Recommendation history</h1>

        {% for entry in history %}
        <div class="container">

            <div class="recommendation-info grid">
                <h3>{{ entry.created_at|date:"d/m/Y - H:i" }}</h3>
                <div class="button-container flex">
                    <button class="black-button">
                        <img src="{% static 'thumb_up.png' %}">
                    </button>
                    <button class="black-button">
                        <img src="{% static 'thumb_down.png' %}">
                    </button>
                </div>
            </div>

            <p>
                Based on:
                {% for m in entry.input_movies %}
                {{ m.title }}{% if not forloop.last %}, {% endif %}
                {% endfor %}
            </p>

            <div class="movies grid">
                {% for movie in entry.recommendations %}
                <div class="movie">
                    <a href="{% url 'movie-page' movie.id %}">
                        <img src="{{ movie.poster_url }}" alt="{{ movie.title }} poster" loading="lazy">
                    </a>
                </div>
                {% endfor %}
            </div>

        </div>
        {% endfor %}
    </div>
    <div class="film-border bottom"></div>
</body>

</html>


<style scoped>
    .wrapper {
        flex-direction: column;
    }

    .container {
        gap: 10px;
        padding: 1rem 1.5rem;
        margin-bottom: 20px;
    }

    h3{
        margin-bottom: 0;
    }

    .button-container {
        gap: 30px;
        justify-content: end;
    }

    .black-button {
        background-color: transparent;
    }

    .movies {
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
    }

    .movie img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
    }
</style>
