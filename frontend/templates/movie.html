{% load static %}
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>


<body>
    <div class="film-border top"></div>
    <main>
        <div class="profile">
            <a href="{% url 'user-page' %}">
                <button id="profile_button">
                    <img src="{% static 'profile.png' %}" alt="User Profile">
                </button>
            </a>
        </div>
        <div class="main-container">
            <div class="poster">
                <img src="{% static 'test.jpg' %}" alt="Test, movie image">
            </div>
            <div class="movie_content">
                <div class="overview">
                    <h3 id="name">{{movie.title}}</h3>
                    <h4 id="date">{{movie.date}}</h4>
                </div>
                <div class="description">
                    <p id="text"> {{movie.description}}</p>
                    <p id="genre">Genres: {{movie.genre}}</p>
                    <p id="cast">Cast: {{movie.crew}}</p>
                </div>
            </div>

        </div>
    </main>
    <div class="film-border bottom"></div>
</body>

</html>

<script>
    const API_ENDPOINT = "{{ api_movie_list_url }}";

    // Event listener to fetch movie data
    document.addEventListener('DOMContentLoaded', () => {
        loadMovie();
    });

    // Function to fetch movie data
    async function loadMovie() {

        const nameElement = document.getElementById('name');
        const dateElement = document.getElementById('date');
        const textElement = document.getElementById('text');
        const genreElement = document.getElementById('genre');
        const castElement = document.getElementById('cast');
        const posterImage = document.querySelector('.poster img');

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

            const responseData = await response.json();
            console.log('Movie data:', responseData);

            if (responseData) {
                nameElement.textContent = responseData.title || 'Movie Title Not Found';
                dateElement.textContent = responseData.date || 'Release Date Not Found';
                textElement.textContent = responseData.description || 'Description Not Found';
                genreElement.textContent = `Genres: ${responseData.genre || 'N/A'}`;
                castElement.textContent = `Cast: ${responseData.crew || 'N/A'}`;
           
            } else {
                
                console.log("Movie data wasn't retrieved");
                nameElement.textContent = 'Error Loading Movie Data';
            }

        } catch (error) {
            console.error('Error:', error.message);
        }
    }
</script>

<style scoped>
    main {
        flex-direction: column;
    }

    .main-container {
        width: 80%;
        padding: 1rem 2rem;
        display: flex;
        gap: 30px;
        text-align: left;
    }

    .poster {
        flex: 0.7;
    }

    .movie_content {
        flex: 2.3;
    }

    .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 40px;
    }

    .overview {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
    }

    p {
        text-align: justify;
    }

    #genre,
    #cast {
        font-weight: bold;
        color: white;
    }
</style>
