{% load static %}
{% include "menu.html" with show_home=True show_profile=True show_search=True show_history=True show_logout=True %}
<!DOCTYPE html>
<html>

<head>
    <!--Implemented by Júlia -->
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>


<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">
        <div class="film-strip flex">
            <div class="recs flex">
                <div class="container flex">
                    <div class="poster">
                        <img src={{movie.poster_url}} alt="{{ movie.title }} poster" class="img">
                    </div>
                    <div class="movie-content">
                        <div class="overview">
                            <h3 id="name">{{movie.title}}</h3>
                            <h4 id="release_date">{{movie.release_date}}</h4>
                        </div>
                        <div class="description">
                            <p id="overview">{{movie.overview}}</p>
                            <p id="genres">Genres: {{movie.genres|join:", "}}</p>
                            <p></p>
                            <p id="cast">Cast: {{movie.crew}}</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="film-border bottom"></div>
</body>

</html>

<style scoped>
    .container {
        flex-direction: row;
    }

    .poster {
        flex: 1;
    }

    .movie-content {
        flex: 2;
        padding: 1rem;
    }

    .overview {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    p {
        text-align: justify;
    }
</style>
