{% load static %}
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>


<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">
        <div class="container">
            <div class="poster">
                <img src={{movie.poster_url}} alt="Test, movie image">
            </div>
            <div class="movie-content">
                <div class="overview">
                    <h3 id="name">{{movie.title}}</h3>
                    <h4 id="release_date">{{movie.release_date}}</h4>
                </div>
                <div class="description">
                    <p id="overview">{{movie.overview}}</p>
                    <p id="genres">Genres: {{movie.genres|join:", "}}</p>
                    <p id="cast">Cast: {{movie.crew}}</p>
                </div>
            </div>
        </div>
    </div>

    <div class="film-border bottom"></div>
</body>

</html>

<style scoped>
    .container {
        gap: 30px;
        flex-direction: row;
    }

    .poster {
        flex: 1;
    }

    .movie-content {
        flex: 2;
    }

    .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 5px;
    }

    .overview {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    p {
        text-align: justify;
    }
</style>
