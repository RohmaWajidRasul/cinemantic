{% load static %}
{% include "menu.html" with show_home=True show_profile=True show_search=False show_history=True %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<html>

<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">
        <form class="searchbar flex" method="GET" action="{% url 'search-page' %}">
            <input type="text" name="movie-name" id="movie-name" placeholder="Movie name">
            <button type="submit" class="search-button">
                <img src="{% static 'search.png' %}" alt="Search icon">
            </button>
        </form>
        <div class="movies">
            {% for movie in movies %}
            <div class="movie flex">
                <a href="{% url 'recommendation-page' movie_id=movie.id %}">
                    <img src={{movie.poster_url}} alt="Movie poster">
                </a>
            </div>
            {% endfor %}

        </div>
    </div>

    <div class="film-border bottom"></div>
</body>

</html>

<style scoped>
    .wrapper {
        flex-direction: column;
        justify-content: start;
    }

    .searchbar {
        background: #dad9d9;
        border-radius: 40px;
        padding: 10px 15px;
        justify-content: space-between;
        margin: 20px 0;
    }

    .searchbar input {
        border: none;
        background: #dad9d9;
        font-size: 1.5em;
        outline: none;
    }

    .search-button {
        background-color: transparent;
        padding: 0;
        width: 5%;
        height: 5%;
        object-fit: contain;
    }

    .search-button img {
        width: 100%;
        height: auto;
    }

    .movies {
        display: grid;
        width: 90%;
        grid-template-columns: repeat(auto-fill,
                minmax(250px, 1fr));
        align-items: center;
        overflow: scroll;
        gap: 10px;
        padding-top: 20px;
    }

    .movies::-webkit-scrollbar {
        display: none;
    }

    .movie a {
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 15px;
    }

    .movie a:hover {
        border: 3px solid rgba(255, 255, 0, 0.5);
    }

    .movie img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
</style>
