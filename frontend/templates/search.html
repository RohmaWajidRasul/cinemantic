{% load static %}
{% include "menu.html" with show_home=True show_profile=True show_search=False show_history=True show_logout=True %}
<!DOCTYPE html>

<head>
    <!--Implemented by Júlia -->
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<html>

<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">
        <form class="searchbar grid" method="GET" action="{% url 'search-page' %}">
            <input type="text" name="movie-name" id="movie-name" placeholder="Movie name" autocomplete="off">
            <button type="submit" class="search-button flex">
                <img src="{% static 'icon/search.png' %}" alt="Search icon" class="icon">
            </button>
            <button type="submit" class="search-button flex" formaction="{% url 'recommendation-page' %}">
                <p>External</p>
            </button>
        </form>
        <div class="movies">
            {% for movie in movies %}
            <div class="movie flex">
                <a href="{% url 'recommendation-page' movie_id=movie.id %}">
                    <img src={{movie.poster_url}} alt="{{movie.title}} poster" class="img">
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="film-border bottom"></div>
</body>

</html>

<style scoped>
    .wrapper {
        flex-direction: column;
        justify-content: start;
    }

    .movies {
        display: grid;
        width: 85%;
        grid-template-columns: repeat(auto-fill,
                minmax(250px, 1fr));
        align-items: center;
        overflow: scroll;
        gap: 10px;
        padding-top: 20px;
    }

    .movie a {
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 15px;
    }

    .movie a:hover {
        border: 3px solid rgba(255, 255, 0, 0.5);
    }

    .movie img {
        display: block;
    }

    .search-button {
        width: 100%;
        color: white;
    }
</style>
