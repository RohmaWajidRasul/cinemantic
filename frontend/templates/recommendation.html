{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <main>
        <div class="sidebar flex">
            <div class="searchbar flex">
                <input type="text" name="movie-name" id="movie-name" placeholder="Movie name">
                <button onclick="loadMovies()" class="search-button">
                    <img src="{% static 'search.png' %}" alt="Search icon">
                </button>
            </div>
            <div class="searched-movies flex">
                <div class="movies-container flex" id="movies-container">
                </div>
            </div>
        </div>
        <div class="chat-container">
            <div class="profile">
                <a href="{% url 'profile-page' %}">
                    <button id="profile-button">
                        <img src="{% static 'profile.png' %}" alt="User Profile">
                    </button>
                </a>
            </div>
            <div class="history">
                <a href="{% url 'history-page' %}">
                    <button id="history-button">
                        <img src="{% static 'movie.png' %}" alt="User Profile">
                    </button>
                </a>
            </div>
            <div class="white-container"></div>
        </div>

    </main>
</body>

</html>

<script>
    const API_ENDPOINT = 'http://127.0.0.1:8000/api/v1/movies/?title=';

    async function loadMovies() {
        const nameElement = document.getElementById('movie-name');
        const title = nameElement.value;
        const moviesContainer = document.getElementById('movies-container');

        MOVIE_ENDPOINT = API_ENDPOINT.concat(title);

        try {
            const response = await fetch(MOVIE_ENDPOINT, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

            const responseData = await response.json();
            console.log('Movie data:', responseData);

            if (responseData) {

                const moviesHtmlArray = responseData.map(movie => {
                    
                    return `
                    <div class="movie flex">
                        <h4 class="movie-title">${movie.title}</h4>
                        <button class="black-button" id="pick-button">Pick</button>
                    </div>
                    `;
                });

                const finalHtml = moviesHtmlArray.join('');
                moviesContainer.innerHTML = finalHtml;

            } else {

                console.log("Movie data wasn't retrieved");
                nameElement.textContent = 'Error Loading Movie Data';
            }

        } catch (error) {
            console.error('Error:', error.message);
        }
    }
</script>
