{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <main>
        <div class="profile">
            <a href="{% url 'profile-page' %}">
                <button id="profile-button">
                    <img src="{% static 'profile.png' %}" alt="User Profile">
                </button>
            </a>
        </div>
        <div class="search">
            <a href="{% url 'search-page' %}">
                <button id="search-button">
                    <img src="{% static 'search.png' %}" alt="User Profile">
                </button>
            </a>
        </div>
        <div class="history">
            <a href="{% url 'history-page' %}">
                <button id="history-button">
                    <img src="{% static 'movie.png' %}" alt="User Profile">
                </button>
            </a>
        </div>

        <div class="main-container">
            {% for rec in recs.recommendations %}
            <div class="rec-card">
                <a href="{% url 'movie-page' rec.id %}" class="rec-poster">
                    <img
                        src="{{ rec.poster_url }}"
                        alt="{{ rec.title }} poster"
                        loading="lazy"
                    >
                </a>

                <div class="rec-info">
                    <h3>
                        <a href="{% url 'movie-page' rec.id %}" class="rec-title">
                            {{ rec.title }}
                        </a>
                    </h3>
                    <p>{{ rec.overview }}</p>
                </div>
            </div>
            {% endfor %}
        </div>



    </main>
    <div class="film-border bottom"></div>
</body>

</html>

<style scoped>

    .rec-card {
        display: flex;
        gap: 1rem;
        width: 100%;
        margin-bottom: 1.5rem;
        align-items: flex-start;
        justify-content: flex-start;
    }

    .rec-poster img {
        width: 90px;
        height: auto;
        border-radius: 4px;
        object-fit: cover;
    }

    .rec-info {
        text-align: left;
        flex: 1;
    }

    .rec-title {
        text-decoration: none;
        color: inherit;
    }

    .rec-title:hover {
        text-decoration: underline;
    }

    .rec-info p {
        margin-top: 0.5rem;
        text-align: justify;
    }



    .profile {
        top: 60px;
    }

    .search {
        top: 120px;
    }

    .history {
        top: 180px;
    }

    main {
        align-items: center;
        height: calc(100vh - 120px);
    }

    .main-container {
        width: 70%;
        height: 400px;
        padding: 1rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: scroll;
    }

    .main-container::-webkit-scrollbar {
        display: none;
    }

    .content h3 {
        text-align: left;
    }

    .content p {
        text-align: justify;
    }
</style>
