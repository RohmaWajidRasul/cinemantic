{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <main>
        <div class="sidebar flex">

            <form class="searchbar flex" method="GET" action="{% url 'recommendation-page' %}">
                <input type="text" name="movie-name" id="movie-name" placeholder="Movie name">
                <button type="submit" class="search-button">
                    <img src="{% static 'search.png' %}" alt="Search icon">
                </button>
            </form>

            <div class="searched-movies flex">
                {% for movie in movies %}
                <div class="movie flex">
                    <h4 class="movie-title">{{movie.title}}</h4>
                    <a href="{% url 'recommendation-page' %}?id={{ movie.id }}">
                        <button class="black-button" type="button">Pick</button>
                    </a>
                </div>
                {% endfor %}
            </div>

        </div>
        <div class="chat-container">

            <div class="profile">
                <a href="{% url 'profile-page' %}">
                    <button id="profile-button">
                        <img src="{% static 'profile.png' %}" alt="User Profile">
                    </button>
                </a>
            </div>
            <div class="history">
                <a href="{% url 'history-page' %}">
                    <button id="history-button">
                        <img src="{% static 'movie.png' %}" alt="User Profile">
                    </button>
                </a>
            </div>

            <div class="white-container">
                {% for rec in recs.recommendations %}
                    <p>{{rec.title}}</p>
                {% endfor %}

            </div>
        </div>

    </main>
</body>

</html>

<style scoped>
    /* ==================================================================== */

    .flex {
        display: flex;
    }

    main {
        padding: 0;
    }

    .sidebar,
    .searched-movies,
    .movies-container {
        flex-direction: column;
    }

    .sidebar,
    .pick-button {
        flex: 2;
    }

    .searched-movies,
    .movie-title,
    .chat-container {
        flex: 8;
    }

    /* ==================================================================== */
    .sidebar {
        background-color: #F2F2F7;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        height: 97vh;
    }

    /* ==================================================================== */

    .searchbar {
        background: #f4f4f4;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 40px;
        border: 1px solid #e0e0e0;
        padding: 12px 15px;
        margin-top: 5px;
        align-items: center;
        justify-content: space-between;
    }

    .searchbar input {
        border: none;
        background: transparent;
        font-size: 16px;
        outline: none;
    }

    .search-button {
        background-color: transparent;
        padding: 0;
        width: 25px;
        height: 25px;
        object-fit: contain;
        border: none;
    }

    .search-button img {
        width: 100%;
        height: auto;
    }

    /* ==================================================================== */

    .searched-movies {
        margin-top: 15px;
        overflow-y: scroll;
    }

    .movie {
        height: fit-content;
        padding: 0.2rem 0rem;
        align-items: center;
        border-bottom: 1px solid #D9D9D9;
        flex-direction: row;
    }

    .black-button {
        font-weight: normal;
        font-size: 12px;
        padding: 10px;
        height: max-content;
    }

    /* ==================================================================== */

    .searched-movies::-webkit-scrollbar,
    .chat::-webkit-scrollbar {
        display: none;
    }

    .searched-movies,
    .chat {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    /* ==================================================================== */

    .chat-container {
        flex: 8;
        display: flex;
        flex-direction: column;
        padding: 20px 0;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .profile {
        top: 0;
        right: 20px;
    }

    .history {
        top: 0;
        right: 80px;
    }

    .white-container {
        height: 500px;
        width: 90%;
        padding: 15px;
        box-sizing: border-box;
        overflow-y: auto;
        margin-top: 70px;
    }
</style>
