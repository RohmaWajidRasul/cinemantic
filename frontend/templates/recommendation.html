{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <main>
        <div class="profile">
            <a href="{% url 'profile-page' %}">
                <button id="profile-button">
                    <img src="{% static 'profile.png' %}" alt="User Profile">
                </button>
            </a>
        </div>
        <div class="search">
            <a href="{% url 'search-page' %}">
                <button id="search-button">
                    <img src="{% static 'search.png' %}" alt="User Profile">
                </button>
            </a>
        </div>
        <div class="history">
            <a href="{% url 'history-page' %}">
                <button id="history-button">
                    <img src="{% static 'movie.png' %}" alt="User Profile">
                </button>
            </a>
        </div>

        <div class="main-container">

            {% for rec in recs.recommendations %}
            <div class="content">
                <h3>{{rec.title}}</h3>
                <p>{{rec.overview}}</p>
            </div>
            {% endfor %}

        </div>


    </main>
    <div class="film-border bottom"></div>
</body>

</html>

<style scoped>
    .profile {
        top: 0px;
    }

    .search {
        top: 60px;
    }

    .history {
        top: 120px;
    }

    .main-container {
        width: 70%;
        height: 400px;
        padding: 1rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: scroll;
    }

    .main-container::-webkit-scrollbar {
        display: none;
    }

    .content h3 {
        text-align: left;
    }

    .content p {
        text-align: justify;
    }
</style>
