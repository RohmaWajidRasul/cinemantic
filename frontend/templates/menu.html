{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="dropdown">
        <button class="dropbtn">
            <img src="{% static 'menu.png' %}" alt="Menu icon">
        </button>
        <div class="dropdown-content">
            {% if show_home %}
            <a href="{% url 'homepage' %}">
                <img src="{% static 'home.png' %}" alt="Homepage icon">
            </a>
            {% endif %}

            {% if show_profile %}
            <a href="{% url 'profile-page' %}">
                <img src="{% static 'profile.png' %}" alt="Profile icon">
            </a>
            {% endif %}

            {% if show_search %}
            <a href="{% url 'search-page' %}">
                <img src="{% static 'search.png' %}" alt="Search icon">
            </a>
            {% endif %}

            {% if show_history %}
            <a href="{% url 'history-page' %}">
                <img src="{% static 'movie.png' %}" alt="History icon">
            </a>
            {% endif %}


            <form method="post" action="{% url 'logout-page' %}" class="flex">
                {% csrf_token %}
                <button type="submit">
                    <img src="{% static 'close.png' %}" alt="Logout icon">
                </button>
            </form>

        </div>
    </div>
</body>

<html>

<style>
    .flex {
        margin: 0;
        padding: 0;
    }
</style>
