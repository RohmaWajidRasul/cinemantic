{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <div class="header">
        <h1>Cinemantic</h1>
    </div>
    <div class="white-container">
        <form class="form" id="registration-form" onsubmit="handleRegistration(event)">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Your username" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Your email" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Your password" required>

            <button type="submit" class="black-button">Register</button>
        </form>
    </div>
    <div class="film-border bottom"></div>
</body>

</html>

<script>
    const API_ENDPOINT = 'http://127.0.0.1:8000/api/v1/users/';

    async function handleRegistration(event) {
        event.preventDefault();

        const form = document.getElementById('registration-form');
        const registerData = {
            username: form.username.value,
            email: form.email.value,
            password: form.password.value,
        };
        const targetPage = "{% url 'login-page' %}"

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registerData)
            })

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

            const responseData = await response.json();
            form.reset();
            console.log('Successful registration');

            // Todo: change to pop up with button
            window.location.href = targetPage;


        } catch (error) {
            console.log("Error:", error.message);
            if (error.email) {
                console.log(error.email[0]);
            } else if (error.password) {
                console.log(error.password[0]);
            }
        }
    }
</script>
