{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <div class="wrapper flex">
        <div class="admin-form">
            <div class="header">
                <h1>Training model</h1>
            </div>
            <div class="white-container">
                <div class="divider"></div>
                <form class="form" id="retrain-form" onsubmit="handleRetraining(event)">

                    <label for="csv">CSV file:</label>
                    <input type="file" name="csv" id="csvFileInput" accept=".csv, text/csv" placeholder="csvFile"
                        required>

                    <label for="batch">Desired batch size:</label>
                    <input type="number" name="batch" id="batchInput" placeholder="Standard: 128" required>

                    <label for="epoch">Desired epoch:</label>
                    <input type="number" name="epoch" id="epochInput" placeholder="Standard: 1-3" required>

                    <button type="submit" id="retrain-button" class="black-button">Retrain</button>
                </form>
                <div class="divider"></div>
            </div>
        </div>
        <div class="model-info">
            <div class="header">
                <h1>Model version status</h1>
            </div>

            <div class="white-container">
                <table class="model-table">
                    <thead>
                        <tr>
                            <th>Version</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Likes</th>
                            <th>Dislikes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- TODO: add likes and dislikes data -->
                        {% for model in model_versions %}
                        <tr>
                            <td>{{ model.version }}</td>
                            <td class="status {{ model.status }}">
                                {{ model.status|cut:"_"|capfirst }}
                            </td>
                            <td>{{ model.created_at|date:"d/m/Y H:i" }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3">No model versions found</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="film-border bottom"></div>
</body>

</html>


<style scoped>
    .admin-form,
    .model-info {
        flex: 5;
    }

    .model-info .white-container {
        width: 80%;
    }

    .header {
        margin-bottom: 10px;
        text-align: center;
    }

    .model-table {
        width: 100%;
        border-collapse: collapse;
        color: #0d0d0d;
    }

    .model-table th,
    .model-table td {
        padding: 10px 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    .model-table th {
        font-weight: bold;
    }

    .status {
        padding: 4px 8px;
        border-radius: 6px;
        background-color: rgba(41, 128, 185, 0.15);
    }

    .status.current {
        color: #27ae60;
        font-weight: bold;
    }

    .status.ready {
        color: #2980b9;
        font-weight: normal;
    }

    .status.fine_tuning {
        color: #f39c12;
        font-weight: bold;
    }

    .status.fail {
        color: #e74c3c;
        font-weight: bold;
    }
</style>
