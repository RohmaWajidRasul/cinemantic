{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
        <main class="admin-layout">
            <div class="admin-form">
                <div class="header">
                    <h1>Training model</h1>
                </div>
                <div class="white-container">

                    <form class="form" id="retrain-form" onsubmit="handleRetraining(event)">

                        <label for="csv">CSV file:</label>
                        <input type="file" name="csv" id="csvFileInput" accept=".csv, text/csv" placeholder="csvFile" required>

                        <label for="batch">Desired batch size:</label>
                        <input type="number" name="batch" id="batchInput" placeholder="Standard: 128" required>

                        <label for="epoch">Desired epoch:</label>
                        <input type="number" name="epoch" id="epochInput" placeholder="Standard: 1-3" required>

                        <button type="submit" id="retrain-button" class="black-button">Retrain</button>
                    </form>
                    
                </div>
            </div>
            <div class="model-info">
    <div class="header">
        <h1>Model version status</h1>
    </div>

    <div class="white-container">
        <table class="model-table">
            <thead>
                <tr>
                    <th>Version</th>
                    <th>Status</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody>
                {% for model in model_versions %}
                <tr>
                    <td>{{ model.version }}</td>
                    <td class="status {{ model.status }}">
                        {{ model.status|cut:"_"|capfirst }}
                    </td>
                    <td>{{ model.created_at|date:"d/m/Y H:i" }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">No model versions found</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

        </div>

        </main>
    <div class="film-border bottom"></div>
</body>

</html>


<style>

    main.admin-layout {
        padding-top: calc(var(--film-border-height) + 20px);
    }

    .model-info .white-container {
        max-height: 400px;   /* adjust as you like */
        overflow-y: auto;
        overflow-x: hidden;

        scrollbar-width: none;        /* Firefox */
        -ms-overflow-style: none;     /* IE / Edge */
    }

    .model-info .white-container::-webkit-scrollbar {
        width: 0;
        height: 0;
    }


    .model-table thead th {
        position: sticky;
        top: 0;
        background-color: #F2F2F7;
        z-index: 1;
    }


    .main{
        display: flex;
        flex-direction: row;
        align-items: center;
    }

    .admin-form, .model-info{
        flex: 5;
    }

    .header {
        margin-bottom: 10px;
    }

    .admin-layout {
        display: flex;
        gap: 40px;
        padding: 20px 40px;
    }

    .admin-form,
    .model-info {
        flex: 1;
    }

    .model-table {
        width: 100%;
        border-collapse: collapse;
        color: #0d0d0d;
    }

    .model-table th,
    .model-table td {
        padding: 10px 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    .model-table th {
        font-weight: bold;
    }

    .status.current {
        background-color: rgba(39, 174, 96, 0.15); /* green */
        padding: 4px 8px;
        border-radius: 6px;
        color: #27ae60;
        font-weight: bold;
    }

    .status.ready {
        background-color: rgba(41, 128, 185, 0.15); /* blue */
        color: #2980b9;
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: normal;
    }

    .status.fine_tuning {
        background-color: rgba(243, 156, 18, 0.15); /* orange */
        color: #f39c12;
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: bold;
    }

    .status.fail {
        background-color: rgba(231, 76, 60, 0.15); /* red */
        padding: 4px 8px;
        border-radius: 6px;
        color: #e74c3c;
        font-weight: bold;
    }


</style>
