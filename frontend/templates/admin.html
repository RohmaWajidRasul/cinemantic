{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
        <main>
            <div class="admin-form">
                <div class="header">
                    <h1>Training model</h1>
                </div>
                <div class="white-container">

                    <form class="form" id="retrain-form" onsubmit="handleRetraining(event)">

                        <label for="csv">CSV file:</label>
                        <input type="file" name="csv" id="csvFileInput" accept=".csv, text/csv" placeholder="csvFile" required>

                        <label for="batch">Desired batch size:</label>
                        <input type="number" name="batch" id="batchInput" placeholder="Standard: 128" required>

                        <label for="epoch">Desired epoch:</label>
                        <input type="number" name="epoch" id="epochInput" placeholder="Standard: 1-3" required>

                        <button type="submit" id="retrain-button" class="black-button">Retrain</button>
                    </form>
                    
                </div>
            </div>
            <div class="model-info">
                <div class="header">
                    <h1>Model version status</h1>
                </div>
                <div class="white-container">
                    <h1>{{response}}</h1>
                </div>
            </div>
        </div>

        </main>
    <div class="film-border bottom"></div>
</body>

</html>

    const model_Endpoint = 'http://127.0.0.1:8000/api/v1/admin/model-versions/'

    document.addEventListener('DOMContentLoaded', () => {
        loadModelVersionStatus();
    });

    async function loadModelVersionStatus() {
        try {

            const response = await fetch(model_Endpoint, {
                method: 'GET',
                credentials: 'include',
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

        }

        formData.append('epochs', epochInput.value);

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                credentials: 'include',
                body: formData
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }
