# =============================================================================
# 1. Kubernetes Service Account for Workload Identity                         =   
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  annotations:
    iam.gke.io/gcp-service-account: "${CLOUDSQL_SA_EMAIL}"
---
# =============================================================================
# 2. Secret: Cloud SQL credentials                                            =
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloudsql-credentials
type: Opaque
stringData:
  username: "${TF_VAR_db_user}"
  password: "${TF_VAR_db_password}"
---
# =============================================================================
# 2b. Secret: Shared secret for internal service communication                =
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: internal-shared-secret
type: Opaque
stringData:
  model-update-secret: "${INTERNAL_MODEL_UPDATE_SECRET}"
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"