{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <main class="flex">
        <div class="sidebar flex">
            <div class="searchbar flex">
                <input type="text" name="movie-name" id="movie_name" placeholder="Movie name">
                <button class="search_button">
                    <img src="{% static 'search.png' %}" alt="Search icon">
                </button>
            </div>
            <div class="searched_movies flex">
                <div class="movie flex">
                    <h4 class="movie_title">Movie 1</h4>
                    <button class="black-button" id="pick-button">Pick</button>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="profile flex">
                <button id="profile_button">
                    <img src="{% static 'account_circle.png' %}" alt="Profile icon">
                </button>
            </div>
            <div class="chat container flex">
                <p class="typing"> Lorem ipsum dolor sit amet, consectetur adipiscing elit. Mauris sed bibendum mauris.
                </p>
            </div>

        </div>

    </main>
</body>

</html>

<style scoped>
    .flex {
        display: flex;
    }

    main {
        padding: 0;
    }

    .sidebar,
    .searched_movies,
    .chat {
        flex-direction: column;
    }

    .sidebar,
    .pick_button {
        flex: 2;
    }

    .searched_movies,
    .movie_title,
    .container {
        flex: 8;
    }

    /* Sidebar styling */
    .sidebar {
        background-color: #F2F2F7;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        height: 100vh;
    }

    .searchbar {
        background: #f4f4f4;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 40px;
        border: 1px solid #e0e0e0;
        padding: 12px 15px;
        margin-top: 5px;
        align-items: center;
        justify-content: space-between;
    }

    .searchbar input {
        border: none;
        background: transparent;
        font-size: 16px;
        outline: none;
    }

    .search_button {
        background-color: transparent;
        padding: 0;
        width: 25px;
        height: 25px;
        object-fit: contain;
    }

    .search_button img {
        width: 100%;
        height: auto;
    }

    .searched_movies {
        margin-top: 15px;
        overflow-y: scroll;
    }

    .movie {
        height: fit-content;
        padding: 0.2rem 0.1rem;
        align-items: center;
        border-bottom: 1px solid #D9D9D9;
        flex-direction: row;
    }

    #pick-button {
        font-weight: normal;
        font-size: 12px;
        padding: 10px;
        height: max-content;
    }

    /* Main styling */

    .main-container {
        width: 100%;
        margin: auto 30px;
    }

    .profile {
        flex: 1.5;
        align-items: center;
        justify-content: flex-end;
        padding-right: 20px;
    }

    .chat {
        flex: 8.5;
        padding: 1rem 1.8rem;
        width: 80%;
        margin: 0 auto 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background-color: #F2F2F7;
        overflow: scroll;
    }

    /* Scrolling styling */
    .searched_movies::-webkit-scrollbar,
    .chat::-webkit-scrollbar {
        display: none;
    }

    .searched_movies,
    .chat {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    .typing {
        width: 0;
        overflow: hidden;
        white-space: nowrap;
        border-right: 2px solid black;
        /* cursor */
        animation: typing 4s steps(40, end), blink .75s step-end infinite;
        font-family: monospace;
    }

    @keyframes typing {
        from {
            width: 0;
        }

        to {
            width: 100%;
        }
    }
</style>
