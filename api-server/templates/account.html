{% load static %}
<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<html>

<body>
    <div class="film-border top"></div>
    <!--TODO: might have to change, check with Rohma -->
    <main>
        <div class="main-container">
            <div class="form">
                <label for="current_username">Username</label>
                <input type="text" name="current_username" id="current_username" placeholder="Loading username..."
                    disabled>

                <label for="bio">Bio</label>
                <input type="text" name="bio" id="bio" placeholder="Bio" required>

                <div class="button_container">
                    <button onclick="changeUser()" class="blue-button">Change bio</button>
                </div>

            </div>
            <form class="form">
                <label for="new_password">New password</label>
                <input type="password" name="password" id="new_password" placeholder="New password" required>

                <label for="new_password">Repeat password</label>
                <input type="password" name="repeat_password" id="repeat_password" placeholder="Repeat password"
                    required>
                <div class="button_container">
                    <button class="blue-button">Change password</button>
                </div>
            </form>
        </div>
    </main>
    <div class="film-border bottom"></div>
</body>

</html>

<script>
    // Event listener to fetch user data
    document.addEventListener('DOMContentLoaded', () => {
        const apiEndpoint = "{% url 'api-get-user-profile' %}"
        loadUserProfile(apiEndpoint);
    });

    // Function to fetch user data
    async function loadUserProfile(apiEndpoint) {

        const token = localStorage.getItem('access_token');
        const usernameInputId = 'current_username';
        const bioInputId = 'bio';
        const loginPageUrl = "{% url 'login-page' %}";
        const usernameInput = document.getElementById(usernameInputId);
        const bioInput = document.getElementById(bioInputId);

        // Check authentication (tokens)
        if (!token) {
            console.log('Error: Authentication token not found. Redirecting to login.');
            if (usernameInput) {
                usernameInput.value = 'Please log in to view your profile.';
            }
            window.location.href = loginPageUrl;
            return;
        }

        // Fetch user data
        try {
            const response = await fetch(apiEndpoint, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

            const data = await response.json();
            console.log('Profile data successfully retrieved:', data);

            // Update the username
            if (usernameInput) {
                if (data.profile?.user?.username) {
                    usernameInput.value = data.profile.user.username;
                } else {
                    console.log('Warning: Username field is missing in response.');
                    usernameInput.value = 'Username not found in data.';
                }
            } else {
                console.log(`Error: Username input element with ID '${usernameInputId}' not found.`);
            }

            // Update Bio
            const bioInput = document.getElementById(bioInputId);
            if (bioInput) {
                if (data.profile?.bio) {
                    bioInput.value = data.profile.bio;
                }
            } else {
                console.log(`Error: Bio input element with ID '${bioInputId}' not found.`);
            }

        } catch (error) {
            console.error('Error:', error.message);

            if (usernameInput) {
                usernameInput.value = 'Failed to load the username';
            }

            if (bioInput) {
                bioInput.value = 'Failed to load the bio'
            }

            if (error.message.includes('401')) {
                console.log('Token might be expired or invalid. Redirecting to login.');

                // Todo: change to pop up with button
                window.location.href = loginPageUrl;
            }
        }
    }

    async function changeUser() {
        const bioInputId = 'bio';
        const bioInput = document.getElementById(bioInputId);
        const apiEndpoint = "{% url 'api-get-user-profile' %}";
        const token = localStorage.getItem('access_token');
        const userData = {
            bio: bioInput.value,
        }

        try {
            const response = await fetch(apiEndpoint, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                },
                body: JSON.stringify(userData),
            })

            if (!response.ok) {
                const errorData = await response.json();
                throw errorData;
            }

            const responseData = await response.json();

            //TODO: fix the transition between old and new values
            bioInput.value = '';
            console.log(responseData);
            loadUserProfile(apiEndpoint);


        } catch (error) {
            console.log("Error:", error.message);
        }

    }
</script>

<style scoped>
    .main-container {
        display: flex;
        padding: 5px 0px;
    }

    .form {
        flex: 5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: left;
        margin: 30px auto;
        max-width: 400px;
        width: 90%;
    }

    .form label {
        font-size: 1.1rem;
        padding-left: 0.1em;
        margin-bottom: 0.5ch;
        color: rgba(255, 217, 0, 0.752);
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 0 3px rgba(255, 215, 0, 0.5);
    }

    .form input {
        font-size: 1.1rem;
        margin-bottom: 1.5em;
        padding: 1em 1em;
        background-color: #000;
        color: #f0f0f0;
        border: 2px solid #333;
        border-radius: 4px;
        box-shadow: inset 0 1px 5px rgba(0, 0, 0, 0.9);
    }

    .form input:focus {
        outline: none;
        border-color: gold;
        box-shadow:
            inset 0 1px 5px rgba(0, 0, 0, 0.9),
            0 0 8px rgba(255, 215, 0, 0.7);
    }

    .button_container {
        display: grid;
        justify-items: center;
    }
</style>
